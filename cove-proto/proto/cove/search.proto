syntax = "proto3";

package cove.search;

import "cove/common.proto";

service SearchService {
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  rpc SearchPosts(SearchPostsRequest) returns (SearchPostsResponse);
}

message SearchUsersRequest {
  string query = 1;
  cove.common.PaginationRequest pagination = 2;
}

message SearchUsersResponse {
  repeated cove.common.UserSummary users = 1;
  cove.common.PaginationResponse pagination = 2;
}

message SearchPostsRequest {
  string query = 1;
  cove.common.PaginationRequest pagination = 2;
}

message SearchPostsResponse {
  repeated SearchPostResult results = 1;
  cove.common.PaginationResponse pagination = 2;
}

message SearchPostResult {
  string post_id = 1;
  cove.common.UserSummary author = 2;
  string caption_snippet = 3;
  cove.common.MediaReference thumbnail = 4;
}
