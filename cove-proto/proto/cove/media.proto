syntax = "proto3";

package cove.media;

import "cove/common.proto";
import "google/protobuf/timestamp.proto";

service MediaService {
  rpc InitiateUpload(InitiateUploadRequest) returns (InitiateUploadResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
  rpc GetMediaAccess(GetMediaAccessRequest) returns (GetMediaAccessResponse);
}

message InitiateUploadRequest {
  string filename = 1;
  cove.common.MediaType media_type = 2;
  int64 file_size_bytes = 3;
  string content_type = 4;
}

message InitiateUploadResponse {
  string media_id = 1;
  string upload_url = 2;
  map<string, string> upload_headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message CompleteUploadRequest {
  string media_id = 1;
  string checksum = 2;
}

message CompleteUploadResponse {
  string media_id = 1;
  ProcessingState state = 2;
}

message GetMediaAccessRequest {
  string media_id = 1;
  MediaVariant variant = 2;
}

message GetMediaAccessResponse {
  string url = 1;
  google.protobuf.Timestamp expires_at = 2;
  map<string, string> headers = 3;
}

enum ProcessingState {
  PROCESSING_STATE_UNSPECIFIED = 0;
  PROCESSING_STATE_PENDING = 1;
  PROCESSING_STATE_PROCESSING = 2;
  PROCESSING_STATE_COMPLETED = 3;
  PROCESSING_STATE_FAILED = 4;
}

enum MediaVariant {
  MEDIA_VARIANT_UNSPECIFIED = 0;
  MEDIA_VARIANT_ORIGINAL = 1;
  MEDIA_VARIANT_THUMBNAIL = 2;
  MEDIA_VARIANT_FEED = 3;
  MEDIA_VARIANT_DISPLAY = 4;
}
