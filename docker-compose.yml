services:
  # ── Reverse Proxy / TLS Termination ──
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--entrypoints.grpc.address=:443"
      - "--entrypoints.metrics.address=:9090"
      - "--certificatesresolvers.cove.acme.tlschallenge=true"
      - "--certificatesresolvers.cove.acme.storage=/letsencrypt/acme.json"
    ports:
      - "443:443"
      - "9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - cove-public
      - cove-internal
    restart: unless-stopped

  # ── CoveServer gRPC API ──
  cove-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["cove-server"]
    environment:
      COVE__SERVER__HOST: "0.0.0.0"
      COVE__SERVER__PORT: "50051"
      COVE__DATABASE__URL: "postgres://cove:${POSTGRES_PASSWORD:-cove_secret}@postgres:5432/cove"
      COVE__REDIS__URL: "redis://redis:6379/"
      COVE__STORAGE__DATA_PATH: "/opt/cove/data/media"
      COVE__AUTH__JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      COVE__CRYPTO__MASTER_KEY_PATH: "/run/secrets/master_key"
      COVE__PUSH__ENABLED: "${COVE_PUSH__ENABLED:-false}"
      COVE__PUSH__APNS_KEY_ID: "${COVE_PUSH__APNS_KEY_ID:-}"
      COVE__PUSH__APNS_TEAM_ID: "${COVE_PUSH__APNS_TEAM_ID:-}"
      COVE__PUSH__APNS_BUNDLE_ID: "${COVE_PUSH__APNS_BUNDLE_ID:-}"
      COVE__PUSH__APNS_PRIVATE_KEY_PATH: "/run/secrets/apns_auth_key.p8"
      COVE__PUSH__DEFAULT_ENVIRONMENT: "${COVE_PUSH__DEFAULT_ENVIRONMENT:-development}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grpc.rule=PathPrefix(`/`)"
      - "traefik.http.routers.grpc.entrypoints=grpc"
      - "traefik.http.routers.grpc.tls=true"
      - "traefik.http.services.grpc.loadbalancer.server.port=50051"
      - "traefik.http.services.grpc.loadbalancer.server.scheme=h2c"
    ports:
      - "50051:50051"
    secrets:
      - master_key
    volumes:
      - media-data:/opt/cove/data/media
      - "${COVE_PUSH__APNS_PRIVATE_KEY_PATH:-/dev/null}:/run/secrets/apns_auth_key.p8:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cove-internal
    restart: unless-stopped

  # ── Background Worker ──
  cove-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["cove-worker"]
    environment:
      COVE_DATABASE_URL: "postgres://cove:${POSTGRES_PASSWORD:-cove_secret}@postgres:5432/cove"
      COVE_REDIS_URL: "redis://redis:6379/"
      COVE_STORAGE_DATA_PATH: "/opt/cove/data/media"
    volumes:
      - media-data:/opt/cove/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cove-internal
    restart: unless-stopped

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: cove
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cove_secret}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove -d cove"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cove-internal
    restart: unless-stopped

  # ── Redis ──
  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cove-internal
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  media-data:
  traefik-certs:

networks:
  cove-public:
    driver: bridge
  cove-internal:
    driver: bridge
    internal: true

secrets:
  master_key:
    file: ./secrets/master.key
