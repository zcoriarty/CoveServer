syntax = "proto3";

package cove.user;

import "google/protobuf/timestamp.proto";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  rpc DeactivateAccount(DeactivateAccountRequest) returns (DeactivateAccountResponse);
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  AccountState state = 4;
  google.protobuf.Timestamp created_at = 5;
}

message UpdateUserRequest {
  string email = 1;
}

message UpdateUserResponse {
  string user_id = 1;
  string email = 2;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message DeactivateAccountRequest {}

message DeactivateAccountResponse {}

enum AccountState {
  ACCOUNT_STATE_UNSPECIFIED = 0;
  ACCOUNT_STATE_ACTIVE = 1;
  ACCOUNT_STATE_DEACTIVATED = 2;
  ACCOUNT_STATE_SUSPENDED = 3;
}
