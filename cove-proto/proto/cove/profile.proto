syntax = "proto3";

package cove.profile;

import "cove/common.proto";
import "cove/post.proto";
import "google/protobuf/timestamp.proto";

service ProfileService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc GetProfileGrid(GetProfileGridRequest) returns (GetProfileGridResponse);
  rpc GetProfilePortals(GetProfilePortalsRequest) returns (GetProfilePortalsResponse);
  rpc GetPortalFeed(GetPortalFeedRequest) returns (GetPortalFeedResponse);
  rpc UpdatePortal(UpdatePortalRequest) returns (UpdatePortalResponse);
  rpc ReorderPortals(ReorderPortalsRequest) returns (ReorderPortalsResponse);
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  string bio = 4;
  string avatar_url = 5;
  int32 follower_count = 6;
  int32 following_count = 7;
  int32 post_count = 8;
  bool is_private = 9;
  bool is_following = 10;
  bool is_followed_by = 11;
  bool is_own_profile = 12;
}

message UpdateProfileRequest {
  optional string display_name = 1;
  optional string bio = 2;
  optional string avatar_media_id = 3;
  optional bool is_private = 4;
}

message UpdateProfileResponse {
  string user_id = 1;
  string display_name = 2;
  string bio = 3;
  string avatar_url = 4;
  bool is_private = 5;
}

message GetProfileGridRequest {
  string user_id = 1;
  cove.common.PaginationRequest pagination = 2;
}

message GetProfileGridResponse {
  repeated ProfileGridItem items = 1;
  cove.common.PaginationResponse pagination = 2;
}

message ProfileGridItem {
  string post_id = 1;
  cove.common.MediaReference thumbnail = 2;
  bool is_video = 3;
  bool is_multi = 4;
}

message GetProfilePortalsRequest {
  string user_id = 1;
  string post_id = 2;
}

message GetProfilePortalsResponse {
  repeated PortalSummary portals = 1;
  bool can_edit = 2;
}

message GetPortalFeedRequest {
  string user_id = 1;
  string portal_id = 2;
  cove.common.PaginationRequest pagination = 3;
}

message GetPortalFeedResponse {
  PortalSummary portal = 1;
  repeated cove.post.PostDetail items = 2;
  cove.common.PaginationResponse pagination = 3;
}

message PortalSummary {
  string portal_id = 1;
  string name = 2;
  cove.common.MediaReference cover = 3;
  int32 post_count = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool contains_post = 6;
}

message UpdatePortalRequest {
  string portal_id = 1;
  string name = 2;
}

message UpdatePortalResponse {
  string portal_id = 1;
  string name = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message ReorderPortalsRequest {
  repeated string portal_ids = 1;
}

message ReorderPortalsResponse {}
