syntax = "proto3";

package cove.media;

import "cove/common.proto";

service MediaService {
  rpc UploadMedia(stream UploadMediaRequest) returns (UploadMediaResponse);
  rpc DownloadMedia(DownloadMediaRequest) returns (stream DownloadMediaResponse);
  rpc GetMediaStatus(GetMediaStatusRequest) returns (GetMediaStatusResponse);
}

message UploadMediaRequest {
  oneof payload {
    UploadMediaMetadata metadata = 1;
    bytes chunk_data = 2;
  }
}

message UploadMediaMetadata {
  string filename = 1;
  cove.common.MediaType media_type = 2;
  int64 file_size_bytes = 3;
  string content_type = 4;
  string checksum = 5;
}

message UploadMediaResponse {
  string media_id = 1;
  ProcessingState state = 2;
}

message DownloadMediaRequest {
  string media_id = 1;
  MediaVariant variant = 2;
}

message DownloadMediaResponse {
  oneof payload {
    DownloadMediaHeader header = 1;
    bytes chunk_data = 2;
  }
}

message DownloadMediaHeader {
  string content_type = 1;
  int64 file_size_bytes = 2;
}

message GetMediaStatusRequest {
  string media_id = 1;
}

message GetMediaStatusResponse {
  string media_id = 1;
  ProcessingState state = 2;
}

enum ProcessingState {
  PROCESSING_STATE_UNSPECIFIED = 0;
  PROCESSING_STATE_PENDING = 1;
  PROCESSING_STATE_PROCESSING = 2;
  PROCESSING_STATE_COMPLETED = 3;
  PROCESSING_STATE_FAILED = 4;
}

enum MediaVariant {
  MEDIA_VARIANT_UNSPECIFIED = 0;
  MEDIA_VARIANT_ORIGINAL = 1;
  MEDIA_VARIANT_THUMBNAIL = 2;
  MEDIA_VARIANT_FEED = 3;
  MEDIA_VARIANT_DISPLAY = 4;
}
