version: "3.9"

services:
  # ── Reverse Proxy / TLS Termination ──
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.grpc.address=:443"
      - "--entrypoints.metrics.address=:9090"
      - "--certificatesresolvers.cove.acme.tlschallenge=true"
      - "--certificatesresolvers.cove.acme.storage=/letsencrypt/acme.json"
    ports:
      - "443:443"
      - "9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - cove-public
      - cove-internal
    restart: unless-stopped

  # ── CoveServer gRPC API ──
  cove-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["cove-server"]
    environment:
      COVE_SERVER_HOST: "0.0.0.0"
      COVE_SERVER_PORT: "50051"
      COVE_DATABASE_URL: "postgres://cove:cove_secret@postgres:5432/cove"
      COVE_REDIS_URL: "redis://redis:6379/"
      COVE_STORAGE_ENDPOINT: "http://minio:9000"
      COVE_STORAGE_BUCKET: "cove-media"
      COVE_STORAGE_REGION: "us-east-1"
      COVE_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:-cove}"
      COVE_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-cove_secret}"
      COVE_AUTH_JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      COVE_CRYPTO_MASTER_KEY_PATH: "/run/secrets/master_key"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grpc.rule=PathPrefix(`/`)"
      - "traefik.http.routers.grpc.entrypoints=grpc"
      - "traefik.http.routers.grpc.tls=true"
      - "traefik.http.services.grpc.loadbalancer.server.port=50051"
      - "traefik.http.services.grpc.loadbalancer.server.scheme=h2c"
    secrets:
      - master_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - cove-internal
    restart: unless-stopped

  # ── Background Worker ──
  cove-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["cove-worker"]
    environment:
      COVE_DATABASE_URL: "postgres://cove:cove_secret@postgres:5432/cove"
      COVE_REDIS_URL: "redis://redis:6379/"
      COVE_STORAGE_ENDPOINT: "http://minio:9000"
      COVE_STORAGE_BUCKET: "cove-media"
      COVE_STORAGE_ACCESS_KEY: "${MINIO_ROOT_USER:-cove}"
      COVE_STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-cove_secret}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - cove-internal
    restart: unless-stopped

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: cove
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cove_secret}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove -d cove"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cove-internal
    restart: unless-stopped

  # ── Redis ──
  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cove-internal
    restart: unless-stopped

  # ── MinIO (S3-compatible Object Storage) ──
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-cove}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-cove_secret}"
    volumes:
      - minio-data:/data
    networks:
      - cove-internal
    restart: unless-stopped

  # ── MinIO Bucket Init ──
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        until mc alias set cove http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
        mc mb --ignore-existing cove/cove-media;
        mc anonymous set none cove/cove-media;
        exit 0;
      "
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-cove}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-cove_secret}"
    networks:
      - cove-internal

volumes:
  postgres-data:
  redis-data:
  minio-data:
  traefik-certs:

networks:
  cove-public:
    driver: bridge
  cove-internal:
    driver: bridge
    internal: true

secrets:
  master_key:
    file: ./secrets/master.key
