syntax = "proto3";

package cove.post;

import "cove/common.proto";
import "google/protobuf/timestamp.proto";

service PostService {
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc EditCaption(EditCaptionRequest) returns (EditCaptionResponse);
}

message CreatePostRequest {
  string caption = 1;
  cove.common.Visibility visibility = 2;
  repeated string media_ids = 3;
}

message CreatePostResponse {
  string post_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

message GetPostRequest {
  string post_id = 1;
}

message GetPostResponse {
  PostDetail post = 1;
}

message PostDetail {
  string post_id = 1;
  cove.common.UserSummary author = 2;
  string caption = 3;
  repeated cove.common.MediaReference media = 4;
  int32 like_count = 5;
  int32 comment_count = 6;
  int32 share_count = 7;
  bool liked_by_viewer = 8;
  cove.common.Visibility visibility = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp edited_at = 11;
}

message DeletePostRequest {
  string post_id = 1;
}

message DeletePostResponse {}

message EditCaptionRequest {
  string post_id = 1;
  string caption = 2;
}

message EditCaptionResponse {
  google.protobuf.Timestamp edited_at = 1;
}
