syntax = "proto3";

package cove.share;

import "cove/common.proto";
import "google/protobuf/timestamp.proto";

service ShareService {
  rpc SharePost(SharePostRequest) returns (SharePostResponse);
  rpc GetSharedPosts(GetSharedPostsRequest) returns (GetSharedPostsResponse);
}

message SharePostRequest {
  string post_id = 1;
  string recipient_user_id = 2;
}

message SharePostResponse {
  string share_id = 1;
  google.protobuf.Timestamp shared_at = 2;
}

message GetSharedPostsRequest {
  cove.common.PaginationRequest pagination = 1;
}

message GetSharedPostsResponse {
  repeated SharedPostItem items = 1;
  cove.common.PaginationResponse pagination = 2;
}

message SharedPostItem {
  string share_id = 1;
  cove.common.UserSummary sender = 2;
  string post_id = 3;
  google.protobuf.Timestamp shared_at = 4;
}
