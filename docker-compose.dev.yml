services:
  cove-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["cove-server"]
    env_file:
      - .env
    environment:
      COVE_SERVER__HOST: "0.0.0.0"
      COVE_SERVER__PORT: "50051"
    ports:
      - "0.0.0.0:50051:50051"
      - "0.0.0.0:9090:9090"
    restart: unless-stopped

  cove-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["cove-worker"]
    env_file:
      - .env
    restart: unless-stopped
