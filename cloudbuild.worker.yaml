steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        set -o pipefail

        disabled_server=0
        for service in ${_SERVER_SERVICES}; do
          if gcloud run services describe "$service" --region="${_REGION}" >/tmp/cove-service.err 2>&1; then
            gcloud run services update "$service" --region="${_REGION}" --scaling=0
            disabled_server=1
          elif grep -Eiq "not[ -]?found|could not be found|NOT_FOUND" /tmp/cove-service.err; then
            true
          else
            cat /tmp/cove-service.err >&2
            exit 1
          fi
        done

        if [ "$disabled_server" = "0" ]; then
          echo "No Cloud Run service found among: ${_SERVER_SERVICES}; nothing to disable."
        fi

        if gcloud beta run worker-pools describe "${_WORKER_POOL}" --region="${_REGION}" >/tmp/cove-worker-pool.err 2>&1; then
          gcloud beta run worker-pools update "${_WORKER_POOL}" --region="${_REGION}" --scaling=0
        elif grep -Eiq "not[ -]?found|could not be found|NOT_FOUND" /tmp/cove-worker-pool.err; then
          echo "No Cloud Run worker pool found: ${_WORKER_POOL}; nothing to disable."
        else
          cat /tmp/cove-worker-pool.err >&2
          exit 1
        fi

substitutions:
  _REGION: us-central1
  _SERVER_SERVICES: cove-api cove-server
  _WORKER_POOL: cove-worker

options:
  logging: CLOUD_LOGGING_ONLY
